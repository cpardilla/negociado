<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Negociado</title>
    <meta name="description" content="Material de apoyo para la tramitación: leyes completas, esquemas y guías de la LEC y la LJV." />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/fonts.css" />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/print.css" />
    <!-- In <head> so the chosen theme applies before the first paint. -->
    <script src="assets/js/core/neg.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="app-header" id="header"></header>
      <div class="app-main">
        <nav class="sidebar" id="sidebar" aria-label="Recursos"></nav>
        <main class="content" id="content">
          <div class="content-inner">
            <div id="view" aria-live="polite"></div>
            <footer class="app-footer">Negociado · Material de apoyo, no fuente oficial · Texto legal: BOE, legislación consolidada.</footer>
          </div>
        </main>
      </div>
    </div>
    <noscript><p class="message">Esta aplicación necesita JavaScript.</p></noscript>

    <script src="assets/js/core/data.js"></script>
    <script src="assets/js/core/router.js"></script>
    <script src="assets/js/core/shell.js"></script>
    <script src="assets/js/core/citas.js"></script>
    <script src="assets/js/core/leyes.js"></script>
    <script src="assets/js/core/referencias.js"></script>
    <script src="assets/js/views/inicio.js"></script>
    <script src="assets/js/views/ley.js"></script>
    <script src="assets/js/views/esquema.js"></script>
    <script src="assets/js/views/buscar.js"></script>
    <script>
      Neg.shell.init().then(Neg.start, (err) => {
        document.getElementById("view").innerHTML = Neg.message("No se ha podido iniciar", err.message);
      });
    </script>
  </body>
</html>
